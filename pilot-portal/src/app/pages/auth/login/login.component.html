<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 relative overflow-hidden"
>
  <!-- Animated Background Elements -->
  <div class="absolute inset-0 overflow-hidden">
    <div
      class="absolute -top-40 -right-40 w-80 h-80 bg-blue-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-pulse-slow"
    ></div>
    <div
      class="absolute -bottom-40 -left-40 w-80 h-80 bg-cyan-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-pulse-slow"
      style="animation-delay: 2s"
    ></div>
    <div
      class="absolute top-1/2 left-1/2 w-80 h-80 bg-indigo-500 rounded-full mix-blend-multiply filter blur-xl opacity-20 animate-pulse-slow"
      style="animation-delay: 4s"
    ></div>
  </div>

  <!-- Aircraft Pattern Background -->
  <div class="absolute inset-0 opacity-5">
    <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern
          id="aircraft-pattern"
          x="0"
          y="0"
          width="100"
          height="100"
          patternUnits="userSpaceOnUse"
        >
          <path
            d="M50,30 L60,50 L50,45 L40,50 Z"
            fill="currentColor"
            class="text-white"
          />
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#aircraft-pattern)" />
    </svg>
  </div>

  <div class="w-full max-w-md relative z-10 px-6">
    <!-- Logo and Title -->
    <div class="text-center mb-8 animate-fly-in">
      <div
        class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-blue-500 to-cyan-500 shadow-2xl mb-4"
      >
        <svg
          class="w-10 h-10 text-white"
          fill="currentColor"
          viewBox="0 0 20 20"
        >
          <path
            d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"
          />
        </svg>
      </div>
      <h1 class="text-4xl font-bold text-white mb-2">Pilot Portal</h1>
      <p class="text-blue-200">Your Flight Operations Command Center</p>
    </div>

    <!-- Login Card -->
    <div
      class="glass rounded-2xl shadow-2xl p-8 backdrop-blur-xl border border-white/20 animate-fly-in"
      style="animation-delay: 0.2s"
    >
      <h2 class="text-2xl font-bold text-white text-center mb-6">
        Welcome Back, Pilot
      </h2>

      <!-- AWS Cognito Login Button (Primary) -->
      <div class="mb-6">
        <button
          (click)="loginWithAWS()"
          [disabled]="!cognitoLoginUrl"
          type="button"
          class="w-full py-4 px-4 rounded-lg bg-gradient-to-r from-orange-500 to-red-600 hover:from-orange-600 hover:to-red-700 text-white font-semibold shadow-lg hover:shadow-xl transition-all duration-200 transform hover:scale-105 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none flex items-center justify-center gap-3"
        >
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm0 6c1.657 0 3 1.343 3 3s-1.343 3-3 3-3-1.343-3-3 1.343-3 3-3zm6 12.5c0-1.657 1.343-3 3-3s3 1.343 3 3-1.343 3-3 3-3-1.343-3-3zm-12.5 0c0-1.657 1.343-3 3-3s3 1.343 3 3-1.343 3-3 3-3-1.343-3-3z"
            />
          </svg>
          <span>Sign in with AWS</span>
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 7l5 5m0 0l-5 5m5-5H6"
            />
          </svg>
        </button>
        <p class="text-center text-blue-200 text-xs mt-2">
          AWS Cognito IAM Authentication • 3-minute secure session
        </p>
      </div>

      <!-- Error Message -->
      <div
        *ngIf="error"
        class="p-4 rounded-lg bg-red-500/10 border border-red-500/30 flex items-center gap-3 animate-fly-in"
      >
        <svg
          class="w-6 h-6 text-red-400 flex-shrink-0"
          fill="currentColor"
          viewBox="0 0 20 20"
        >
          <path
            fill-rule="evenodd"
            d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
            clip-rule="evenodd"
          />
        </svg>
        <div>
          <p class="text-red-300 font-medium">Login Error</p>
          <p class="text-red-300 text-sm">{{ error }}</p>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div
      class="text-center mt-12 text-blue-200 text-sm animate-fly-in"
      style="animation-delay: 0.4s"
    >
      <p>🔒 Secure AWS Cognito Authentication</p>
      <p class="text-xs mt-2 text-blue-300">
        Sessions expire after 3 minutes of inactivity
      </p>
    </div>
  </div>
</div>
